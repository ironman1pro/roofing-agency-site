name = "roofing-agency-site"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Every request runs the Worker first, so it can inject the scripts in
# src/global-scripts.js into every HTML page before serving it from ./public.
run_worker_first = ["/*"]
